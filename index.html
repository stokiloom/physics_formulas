<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Формулы по физике (ЦТ / Тренажер)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
    <style>
        :root { --bg: #f4f6f8; --card: #ffffff; --accent: #2c3e50; --border: #dfe4ea; --tag-bg: #eef2f5; --tag-text: #7f8c8d; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--accent); margin: 0; padding: 20px; }
        h1 { text-align: center; margin-bottom: 10px; font-size: 24px; }
        .subtitle { text-align: center; color: var(--tag-text); margin-bottom: 25px; font-size: 14px; }
        .controls { display: flex; gap: 15px; max-width: 900px; margin: 0 auto 30px; flex-wrap: wrap; }
        .controls input, .controls select { 
            flex: 1; padding: 12px 15px; font-size: 16px; border: 1px solid var(--border); 
            border-radius: 8px; background: var(--card); min-width: 200px; outline: none;
        }
        .controls input:focus, .controls select:focus { border-color: #3498db; }
        
        /* Базовая сетка для десктопа */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 20px; 
            max-width: 1400px; 
            margin: 0 auto; 
            grid-auto-rows: 1fr; /* Заставляет все карточки в ряду быть одинаковой высоты */
        }

        .card { 
            background: var(--card); border: 1px solid var(--border); border-radius: 12px; 
            padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: transform 0.2s, box-shadow 0.2s;
            /* --- НОВЫЕ СВОЙСТВА ДЛЯ ПРИЖАТИЯ К НИЗУ --- */
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.08); }
        .card h3 { margin: 0 0 10px 0; font-size: 17px; color: #2980b9; }
        .card .section-tag { display: inline-block; font-size: 11px; background: var(--tag-bg); padding: 4px 8px; border-radius: 4px; margin-bottom: 12px; color: var(--tag-text); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}

        .card .formula {
            font-size: 18px;
            text-align: center;
            margin: 15px 0;
            min-height: 40px;
            max-width: 100%;
            overflow-x: auto;
            line-height: 1.8;
            flex: 1; /* Занимает всё свободное пространство */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card .formula .katex-display {
            margin: 0.5em 0;
            overflow-x: auto;
            overflow-y: hidden;
        }
        .card .desc { 
            font-size: 14px; color: #555; line-height: 1.4; 
            /* --- МАГИЯ: этот отступ займет всё свободное пространство и прижмет блок к низу --- */
            margin-top: auto; 
            border-top: 1px dashed var(--border); padding-top: 10px;
        }
        .empty { text-align: center; color: #95a5a6; grid-column: 1 / -1; padding: 40px; font-size: 18px; }

        /* ========================================== */
        /* МОБИЛЬНАЯ ВЕРСИЯ СО СВАЙПОМ (Scroll Snap)  */
        /* ========================================== */
        @media (max-width: 768px) {
            body { padding: 15px; }
            .controls { flex-direction: column; gap: 10px; margin-bottom: 20px; }
            .controls input, .controls select { width: 100%; }
            .controls input, .controls select {
                width: 100%;
                min-width: unset; /* Убираем min-width: 200px */
                box-sizing: border-box; /* Чтобы padding не увеличивал ширину */
            }
            .grid { 
                display: flex; 
                overflow-x: auto; 
                scroll-snap-type: x mandatory; 
                -webkit-overflow-scrolling: touch; 
                gap: 16px;
                padding: 10px 5px 30px 5px; 
                margin: 0 -5px; 
                scrollbar-width: none; 
                align-items: stretch; /* Гарантирует одинаковую высоту карточек при свайпе */
            }
            .grid::-webkit-scrollbar { 
                display: none; 
            }
            
            .card { 
                flex: 0 0 85vw; 
                scroll-snap-align: center; 
                height: 35vh;
            }
            
            .card:last-child {
                margin-right: 20px;
            }
        }
    </style>
</head>
<body>

    <h1>Справочник формул по физике</h1>
    <p class="subtitle">Все темы школьного курса (на основе сборника Дорофейчик В.В., Жилко В.Н.)</p>

    <div class="controls">
        <input type="text" id="search" placeholder="Поиск по названию или описанию...">
        <select id="section">
            <option value="all">Все разделы (36 тестов)</option>
        </select>
    </div>

    <div class="grid" id="grid"></div>

    <script>
        const formulas = [
            // ТЕСТ 1
            { title: "Скорость равномерного движения", section: "Тест 1. Равномерное прямолинейное движение. Средняя скорость", formula: `$$v = \\frac{\\Delta r}{\\Delta t}$$`, desc: "Отношение перемещения ко времени." },
            { title: "Кинематический закон равномерного движения", section: "Тест 1. Равномерное прямолинейное движение. Средняя скорость", formula: `$$x = x_0 + v_x t$$`, desc: "Координата тела при движении вдоль оси Ox." },
            { title: "Закон сложения скоростей Галилея", section: "Тест 1. Равномерное прямолинейное движение. Средняя скорость", formula: `$$\\vec{v} = \\vec{v}_0 + \\vec{v}_1$$`, desc: "Скорость относительно неподвижной СО." },
            { title: "Средняя скорость пути", section: "Тест 1. Равномерное прямолинейное движение. Средняя скорость", formula: `$$v_{ср} = \\frac{s}{\\Delta t}$$`, desc: "Отношение общего пути ко всему времени." },
            // ТЕСТ 2
            { title: "Ускорение", section: "Тест 2. Равноускоренное прямолинейное движение", formula: `$$\\vec{a} = \\frac{\\vec{v} - \\vec{v}_0}{\\Delta t}$$`, desc: "Отношение изменения скорости ко времени." },
            { title: "Мгновенная скорость", section: "Тест 2. Равноускоренное прямолинейное движение", formula: `$$\\vec{v} = \\vec{v}_0 + \\vec{a}t$$`, desc: "Зависимость скорости от времени." },
            { title: "Перемещение (через время)", section: "Тест 2. Равноускоренное прямолинейное движение", formula: `$$\\Delta \\vec{r} = \\vec{v}_0 t + \\frac{\\vec{a}t^2}{2}$$`, desc: "Формула перемещения." },
            { title: "Перемещение (без времени)", section: "Тест 2. Равноускоренное прямолинейное движение", formula: `$$\\Delta r_x = \\frac{v_x^2 - v_{0x}^2}{2a_x}$$`, desc: "Связь скорости, ускорения и перемещения." },
            { title: "Перемещение (без ускорения)", section: "Тест 2. Равноускоренное прямолинейное движение", formula: `$$\\Delta r_x = \\frac{v_{0x} + v_x}{2}t$$`, desc: "Связь скорости, ускорения и перемещения." },
            { title: "Кинематический закон", section: "Тест 2. Равноускоренное прямолинейное движение", formula: `$$x = x_0 + v_{0x}t + \\frac{a_x t^2}{2}$$`, desc: "Уравнение координаты." },
            // ТЕСТ 3
            { title: "Перемещение при свободном падении", section: "Тест 3. Свободное падение", formula: `$$\\Delta \\vec{r} = \\vec{v}_0 t + \\frac{\\vec{g}t^2}{2}$$`, desc: "Кинематика свободного падения." },
            { title: "Скорость при свободном падении", section: "Тест 3. Свободное падение", formula: `$$\\vec{v} = \\vec{v}_0 + \\vec{g}t$$`, desc: "Кинематика свободного падения." },
            { title: "Бросок под углом к горизонту", section: "Тест 3. Свободное падение", formula: `$$t_{п} = \\frac{2v_0 \\sin\\alpha}{g}$$`, desc: "Время полета." },
            { title: "Бросок под углом к горизонту", section: "Тест 3. Свободное падение", formula: `$$h_{max} = \\frac{v_0^2 \\sin^2\\alpha}{2g}$$`, desc: "Максимальная высота." },
            { title: "Бросок под углом к горизонту", section: "Тест 3. Свободное падение", formula: `$$L = \\frac{v_0^2 \\sin 2\\alpha}{g}$$`, desc: "Дальность полета." },
            // ТЕСТ 4
            { title: "Период", section: "Тест 4. Движение тела по окружности с постоянной угловой скоростью", formula: `$$T = \\frac{t}{N} = \\frac{1}{\\nu}$$`, desc: "Период. Связь периода и частоты." },
            { title: "Частота", section: "Тест 4. Движение тела по окружности с постоянной угловой скоростью", formula: `$$\\nu = \\frac{N}{t} = \\frac{1}{T}$$`, desc: "Частота. Связь периода и частоты." },
            { title: "Угловая скорость и период", section: "Тест 4. Движение тела по окружности с постоянной угловой скоростью", formula: `$$\\omega = \\frac{\\Delta \\varphi}{\\Delta t} = \\frac{2\\pi}{T} = 2\\pi\\nu$$`, desc: "Связь угловой скорости, периода и частоты." },
            { title: "Линейная скорость", section: "Тест 4. Движение тела по окружности с постоянной угловой скоростью", formula: `$$v = \\frac{2\\pi R}{T} = 2\\pi\\nu R = \\omega R$$`, desc: "Связь линейной и угловой скоростей." },
            { title: "Центростремительное ускорение", section: "Тест 4. Движение тела по окружности с постоянной угловой скоростью", formula: `$$a = \\frac{v^2}{R} = \\omega^2 R = \\omega v$$`, desc: "Ускорение при равномерном движении по окружности." },
            // ТЕСТ 5
            { title: "Равнодействующая сила", section: "Тест 5. Законы Ньютона", formula: `$$\\vec{F} = \\vec{F}_1 + \\vec{F}_2 + ... + \\vec{F}_n$$`, desc: "Геометрическая сумма всех сил." },
            { title: "Второй закон Ньютона", section: "Тест 5. Законы Ньютона", formula: `$$\\vec{a} = \\frac{\\vec{F}}{m}$$`, desc: "Ускорение пропорционально силе и обратно пропорционально массе." },
            { title: "Третий закон Ньютона", section: "Тест 5. Законы Ньютона", formula: `$$\\vec{F}_1 = -\\vec{F}_2$$`, desc: "Силы действия и противодействия." },
            { title: "Закон всемирного тяготения", section: "Тест 5. Законы Ньютона", formula: `$$F = G\\frac{m_1 m_2}{r^2}$$`, desc: "Сила гравитационного притяжения." },
            // ТЕСТ 6
            { title: "Сила трения покоя (максимальная)", section: "Тест 6. Сила трения", formula: `$$F_{тр.п. max} = \\mu_{п} N$$`, desc: "Зависит от коэффициента трения покоя и реакции опоры." },
            { title: "Сила трения скольжения", section: "Тест 6. Сила трения", formula: `$$F_{тр} = \\mu N$$`, desc: "Прямо пропорциональна силе нормального давления." },
            // ТЕСТ 7
            { title: "Закон Гука", section: "Тест 7. Сила упругости. Закон Гука", formula: `$$F_{упр} = k \\Delta l$$`, desc: "Сила упругости пропорциональна абсолютному удлинению." },
            { title: "Абсолютное удлинение", section: "Тест 7. Сила упругости. Закон Гука", formula: `$$\\Delta l = l - l_0$$`, desc: "Разность деформированной и начальной длины." },
            // ТЕСТ 8
            { title: "Центростремительная сила", section: "Тест 8. Динамика движения материальной точки по окружности", formula: `$$F_{ц} = m\\frac{v^2}{R} = m\\omega^2 R$$`, desc: "Равнодействующая сил, обеспечивающая движение по окружности." },
            // ТЕСТ 9
            { title: "Импульс тела", section: "Тест 9. Импульс тела. Закон сохранения импульса", formula: `$$\\vec{p} = m\\vec{v}$$`, desc: "Произведение массы на скорость." },
            { title: "Импульс силы (2-й закон Ньютона в импульсной форме)", section: "Тест 9. Импульс тела. Закон сохранения импульса", formula: `$$\\Delta \\vec{p} = \\vec{F}\\Delta t$$`, desc: "Изменение импульса равно импульсу силы." },
            { title: "Закон сохранения импульса", section: "Тест 9. Импульс тела. Закон сохранения импульса", formula: `$$\\vec{p}_1 + \\vec{p}_2 + ... + \\vec{p}_n = const$$`, desc: "В замкнутой системе." },
            // ТЕСТ 10
            { title: "Механическая работа", section: "Тест 10. Механическая работа. Мощность", formula: `$$A = F \\Delta r \\cos\\alpha$$`, desc: "Произведение силы, перемещения и косинуса угла между ними." },
            { title: "Мощность (средняя и мгновенная)", section: "Тест 10. Механическая работа. Мощность", formula: `$$P = \\frac{A}{\\Delta t} = Fv \\cos\\alpha$$`, desc: "Скорость выполнения работы." },
            // ТЕСТ 11
            { title: "Кинетическая энергия", section: "Тест 11. Кинетическая и потенциальная энергии", formula: `$$E_k = \\frac{mv^2}{2}$$`, desc: "Энергия движения тела." },
            { title: "Теорема об изменении кинетической энергии", section: "Тест 11. Кинетическая и потенциальная энергии", formula: `$$A = \\Delta E_k$$`, desc: "Работа равнодействующей сил равна изменению кинетической энергии." },
            { title: "Потенциальная энергия тяготения", section: "Тест 11. Кинетическая и потенциальная энергии", formula: `$$E_n = mgh$$`, desc: "Энергия взаимодействия тел и упруго деформированных тел." },
            { title: "Потенциальная энергия упругости", section: "Тест 11. Кинетическая и потенциальная энергии", formula: `$$E_n = \\frac{k \\Delta l^2}{2}$$`, desc: "Энергия взаимодействия тел и упруго деформированных тел." },
            // ТЕСТ 12
            { title: "Полная механическая энергия", section: "Тест 12. Закон сохранения энергии", formula: `$$E = E_k + E_n$$`, desc: "Сумма кинетической и потенциальной энергий." },
            { title: "Закон сохранения энергии", section: "Тест 12. Закон сохранения энергии", formula: `$$E_k + E_n = const$$`, desc: "В замкнутой системе при действии только потенциальных сил." },
            { title: "Теплота при неупругих столкновениях", section: "Тест 12. Закон сохранения энергии", formula: `$$Q = -\\Delta E_{мех}$$`, desc: "Переход механической энергии в тепловую." },
            // ТЕСТ 13
            { title: "Давление", section: "Тест 13. Давление. Cтатика", formula: `$$p = \\frac{F}{S}$$`, desc: "Давление твердого тела." },
            { title: "Гидростатическое давление", section: "Тест 13. Давление. Cтатика", formula: `$$p = \\rho g h$$`, desc: "Давление столба жидкости." },
            { title: "Сила Архимеда", section: "Тест 13. Давление. Cтатика", formula: `$$F_A = \\rho_{ж} g V_{п}$$`, desc: "Выталкивающая сила в жидкости или газе." },
            { title: "Условия равновесия твердого тела", section: "Тест 13. Давление. Cтатика", formula: `$$\\sum \\vec{F} = 0, \\quad \\sum M = 0$$`, desc: "Равенство нулю суммы сил и моментов сил." },
            { title: "Момент силы", section: "Тест 13. Давление. Cтатика", formula: `$$M = F \\cdot d$$`, desc: "Произведение силы на ее плечо." },
            // ТЕСТ 14
            { title: "Количество вещества", section: "Тест 14. Основное уравнение молекулярно-кинетической теории", formula: `$$\\nu = \\frac{N}{N_A} = \\frac{m}{M}$$`, desc: "Количество вещества." },
            { title: "Молярная масса", section: "Тест 14. Основное уравнение молекулярно-кинетической теории", formula: `$$M = m_0 N_A$$`, desc: "Молярная масса." },
            { title: "Основное уравнение МКТ", section: "Тест 14. Основное уравнение молекулярно-кинетической теории", formula: `$$p = \\frac{1}{3} n m_0 \\overline{v^2} = \\frac{2}{3} n \\overline{E_k}$$`, desc: "Давление идеального газа." },
            { title: "Основное уравнение МКТ", section: "Тест 14. Основное уравнение молекулярно-кинетической теории", formula: `$$p = nkT$$`, desc: "Давление идеального газа через абсолютную температуру." },
            { title: "Абсолютная температура", section: "Тест 14. Основное уравнение молекулярно-кинетической теории", formula: `$$\\Delta t = \\Delta T, \\quad T = t + 273$$`, desc: "Связь температуры в Кельвинах и Цельсиях." },
            { title: "Средняя кинетическая энергия молекул", section: "Тест 14. Основное уравнение молекулярно-кинетической теории", formula: `$$\\overline{E_k} = \\frac{3}{2} k T$$`, desc: "Связь энергии с абсолютной температурой." },
            { title: "Средняя квадратичная скорость", section: "Тест 14. Основное уравнение молекулярно-кинетической теории", formula: `$$\\overline{v^2} = \\frac{3kT}{m_0}$$`, desc: "Квадрат средней квадратичной скорости." },
            // ТЕСТ 15
            { title: "Уравнение Клапейрона - Менделеева", section: "Тест 15. Уравнение состояния идеального газа", formula: `$$pV = \\frac{m}{M} RT$$`, desc: "Уравнение состояния идеального газа." },
            { title: "Уравнение Клапейрона", section: "Тест 15. Уравнение состояния идеального газа", formula: `$$\\frac{pV}{T} = const \\quad (\\nu=const)$$`, desc: "Уравнение Клапейрона." },
            { title: "Закон Дальтона", section: "Тест 15. Уравнение состояния идеального газа", formula: `$$p = p_1 + p_2 + ... + p_n$$`, desc: "Давление смеси газов равно сумме парциальных давлений." },
            // ТЕСТ 16
            { title: "Изопроцессы в идеальном газе", section: "Тест 16. Изопроцессы", formula: `$$pV = const \\quad (T=const)$$`, desc: "Бойля-Мариотта" },
            { title: "Изопроцессы в идеальном газе", section: "Тест 16. Изопроцессы", formula: `$$\\frac{V}{T} = const \\quad (p=const)$$`, desc: "Гей-Люссака" },
            { title: "Изопроцессы в идеальном газе", section: "Тест 16. Изопроцессы", formula: `$$\\frac{p}{T} = const \\quad (V=const)$$`, desc: "Шарля" },
            // ТЕСТ 17
            { title: "Поверхностное натяжение", section: "Тест 17. Поверхностное натяжение. Влажность воздуха", formula: `$$\\sigma = \\frac{A}{\\Delta S} = \\frac{F}{l}$$`, desc: "Коэффициент поверхностного натяжения." },
            { title: "Подъем жидкости в капилляре", section: "Тест 17. Поверхностное натяжение. Влажность воздуха", formula: `$$h = \\frac{2\\sigma}{\\rho g r}$$`, desc: "Высота подъема при полном смачивании." },
            { title: "Относительная влажность воздуха", section: "Тест 17. Поверхностное натяжение. Влажность воздуха", formula: `$$\\varphi = \\frac{p}{p_н} \\cdot 100\\% = \\frac{\\rho}{\\rho_н} \\cdot 100\\%$$`, desc: "Отношение парциального давления к давлению насыщенного пара." },
            // ТЕСТ 18
            { title: "Внутренняя энергия идеального газа", section: "Тест 18. Основы термодинамики", formula: `$$U = \\frac{3}{2} \\frac{m}{M} RT$$`, desc: "Для одноатомного идеального газа." },
            { title: "Работа газа", section: "Тест 18. Основы термодинамики", formula: `$$A = p \\Delta V$$`, desc: "При изобарном процессе." },
            { title: "Первый закон термодинамики", section: "Тест 18. Основы термодинамики", formula: `$$Q = \\Delta U + A$$`, desc: "Теплота идет на изменение внутренней энергии и совершение работы." },
            { title: "Первый закон термодинамики", section: "Тест 18. Основы термодинамики", formula: `$$Q = \\frac{5}{2}p \\Delta V = \\frac {5}{2}\\nu R \\Delta T$$`, desc: "Первый закон термодинамики для идеального одноатомного газа при изобарном процессе." },
            { title: "Первый закон термодинамики", section: "Тест 18. Основы термодинамики", formula: `$$Q = \\frac{3}{2}V \\Delta p = \\frac {3}{2}\\nu R \\Delta T$$`, desc: "Первый закон термодинамики для идеального одноатомного газа при изохорном процессе." },
            { title: "Первый закон термодинамики", section: "Тест 18. Основы термодинамики", formula: `$$Q = A$$`, desc: "Первый закон термодинамики при изотермическом процессе." },
            { title: "Первый закон термодинамики", section: "Тест 18. Основы термодинамики", formula: `$$Q = \\Delta U$$`, desc: "Первый закон термодинамики при изохорном процессе." },
            { title: "Первый закон термодинамики", section: "Тест 18. Основы термодинамики", formula: `$$Q = p \\Delta V + \\Delta U$$`, desc: "Первый закон термодинамики при изобарном процессе." },
            // ТЕСТ 19
            { title: "Количество теплоты при нагревании", section: "Тест 19. Количество теплоты", formula: `$$Q = cm\\Delta t$$`, desc: "Количество теплоты необходимое для нагревания тела." },
            { title: "Количество теплоты фазовые переходы", section: "Тест 19. Количество теплоты", formula: `$$Q = \\lambda m$$`, desc: "Количество теплоты для плавления тела." },
            { title: "Количество теплоты фазовые переходы", section: "Тест 19. Количество теплоты", formula: `$$Q = Lm$$`, desc: "Количество теплоты при парообразовании." },
            { title: "Количество теплоты фазовые переходы", section: "Тест 19. Количество теплоты", formula: `$$Q = qm$$`, desc: "Количество теплоты при сгорании топлива." },
            { title: "Уравнение теплового баланса", section: "Тест 19. Количество теплоты", formula: `$$Q_1 + Q_2 + ... + Q_n = 0$$`, desc: "В замкнутой системе." },
            // ТЕСТ 20
            { title: "Работа цикла и КПД", section: "Тест 20. Циклы. Тепловые двигатели", formula: `$$A = Q_1 - |Q_2|, \\quad \\eta = \\frac{A}{Q_1} \\cdot 100\\%$$`, desc: "Работа теплового двигателя и его термический КПД." },
            { title: "КПД цикла Карно", section: "Тест 20. Циклы. Тепловые двигатели", formula: `$$\\eta_K = \\frac{T_1 - T_2}{T_1} \\cdot 100\\%$$`, desc: "Максимальный КПД для температур нагревателя $T_1$ и холодильника $T_2$." },
            // ТЕСТ 21
            { title: "Закон Кулона", section: "Тест 21. Закон сохранения электрического заряда. Закон Кулона", formula: `$$F = k \\frac{|q_1 q_2|}{r^2} = \\frac{1}{4\\pi\\varepsilon_0} \\frac{|q_1 q_2|}{r^2}$$`, desc: "Сила взаимодействия точечных зарядов в вакууме." },
            { title: "Закон Кулона в среде", section: "Тест 21. Закон сохранения электрического заряда. Закон Кулона", formula: `$$F = \\frac{1}{4\\pi\\varepsilon_0\\varepsilon} \\frac{|q_1 q_2|}{r^2}$$`, desc: "В однородном диэлектрике с проницаемостью $\\varepsilon$." },
            // ТЕСТ 22
            { title: "Напряженность электростатического поля", section: "Тест 22. Напряженность электростатического поля", formula: `$$\\vec{E} = \\frac{\\vec{F}}{q}$$`, desc: "Напряженность электростатического поля." },
            { title: "Напряженность электростатического поля", section: "Тест 22. Напряженность электростатического поля", formula: `$$E = k \\frac{|q|}{r^2}$$`, desc: "Напряженность поля созданного точечным зарядом." },
            { title: "Принцип суперпозиции полей", section: "Тест 22. Напряженность электростатического поля", formula: `$$\\vec{E} = \\vec{E}_1 + \\vec{E}_2 + ... + \\vec{E}_n$$`, desc: "Геометрическая сумма напряженностей." },
            // ТЕСТ 23
            { title: "Потенциал и напряжение", section: "Тест 23. Потенциал. Работа сил электростатического поля", formula: `$$\\varphi = \\frac{W}{q_0}, \\quad U = \\varphi_1 - \\varphi_2$$`, desc: "Энергетическая характеристика поля и разность потенциалов." },
            { title: "Работа поля", section: "Тест 23. Потенциал. Работа сил электростатического поля", formula: `$$A = q(\\varphi_1 - \\varphi_2) = qU$$`, desc: "Работа электростатического поля." },
            { title: "Работа поля", section: "Тест 23. Потенциал. Работа сил электростатического поля", formula: `$$A = qEd$$`, desc: "Для однородного электростатического поля." },
            { title: "Связь напряжения с напряженностью", section: "Тест 23. Потенциал. Работа сил электростатического поля", formula: `$$E = \\frac{U}{d}$$`, desc: "Для однородного поля." },
            // ТЕСТ 24
            { title: "Электроемкость и емкость плоского конденсатора", section: "Тест 24. Конденсаторы", formula: `$$C = \\frac{q}{U}, \\quad C = \\frac{\\varepsilon_0 \\varepsilon S}{d}$$`, desc: "Основные формулы емкости." },
            { title: "Соединение конденсаторов", section: "Тест 24. Конденсаторы", formula: `$$\\frac{1}{C} = \\sum \\frac{1}{C_i} \\quad (посл.)$$`, desc: "Последовательное  соединения." },
            { title: "Соединение конденсаторов", section: "Тест 24. Конденсаторы", formula: `$$C = \\sum C_i \\quad (парал.)$$`, desc: "Параллельное соединения." },
            { title: "Энергия конденсатора", section: "Тест 24. Конденсаторы", formula: `$$W = \\frac{CU^2}{2} = \\frac{q^2}{2C} = \\frac{qU}{2}$$`, desc: "Энергия электрического поля конденсатора." },
            // ТЕСТ 25
            { title: "Закон Ома для участка цепи", section: "Тест 25. Постоянный электрический ток", formula: `$$I = \\frac{U}{R}$$`, desc: "Связь тока, напряжения и сопротивления." },
            { title: "Электрическое сопротивление проводника", section: "Тест 25. Постоянный электрический ток", formula: `$$R = \\rho \\frac{l}{S}$$`, desc: "Сопротивление проводника." },
            { title: "Соединение проводников", section: "Тест 25. Постоянный электрический ток", formula: `$$R = \\sum R_i \\quad (посл.)$$`, desc: "Последовательное  соединения проводников." },
            { title: "Соединение проводников", section: "Тест 25. Постоянный электрический ток", formula: `$$\\frac{1}{R} = \\sum \\frac{1}{R_i} \\quad (парал.)$$`, desc: "Параллельное соединения проводников." },
            // ТЕСТ 26
            { title: "Закон Ома для полной цепи", section: "Тест 26. Закон Ома для полной электрической цепи", formula: `$$I = \\frac{\\mathcal{E}}{R + r}$$`, desc: "Ток в цепи с источником ЭДС." },
            { title: "Ток короткого замыкания", section: "Тест 26. Закон Ома для полной электрической цепи", formula: `$$I_{к.з} = \\frac{\\mathcal{E}}{r}$$`, desc: "Максимальный ток при $R \\to 0$." },
            // ТЕСТ 27
            { title: "Работа тока", section: "Тест 27. Работа и мощность тока", formula: `$$A = qU = IU\\Delta t$$`, desc: "Работа тока." },
            { title: "Работа источника тока", section: "Тест 27. Работа и мощность тока", formula: `$$A = q\\mathcal{E} = I \\mathcal{E}\\Delta t$$`, desc: "Работа источника тока." },
            { title: "Мощность тока", section: "Тест 27. Работа и мощность тока", formula: `$$P = IU = I^2R = \\frac{U^2}{R}$$`, desc: "Мощность тока." },
            { title: "Мощность источника тока", section: "Тест 27. Работа и мощность тока", formula: `$$P = I\\mathcal{E} = \\frac{\\mathcal{E}^2}{R + r} = I^2(R + r)$$`, desc: "Полная мощность в электрической цепи." },
            { title: "Закон Джоуля-Ленца", section: "Тест 27. Работа и мощность тока", formula: `$$Q = I^2R\\Delta t$$`, desc: "Тепловое действие тока." },
            { title: "КПД источника тока", section: "Тест 27. Работа и мощность тока", formula: `$$\\eta = \\frac{R}{R + r} \\cdot 100\\%$$`, desc: "Отношение полезной мощности к полной." },
            // ТЕСТ 28
            { title: "Сила Ампера", section: "Тест 28. Магнитное поле. Сила Ампера и сила Лоренца", formula: `$$F_A = IBl \\sin\\alpha$$`, desc: "Сила действия магнитного поля на проводник с током." },
            { title: "Сила Лоренца", section: "Тест 28. Магнитное поле. Сила Ампера и сила Лоренца", formula: `$$F_L = qvB \\sin\\alpha$$`, desc: "Сила действия магнитного поля на движущийся заряд." },
            // ТЕСТ 29
            { title: "Магнитный поток", section: "Тест 29. Электромагнитная индукция", formula: `$$\\Phi = BS \\cos\\alpha$$`, desc: "Магнитный поток." },
            { title: "ЭДС индукции", section: "Тест 29. Электромагнитная индукция", formula: `$$\\mathcal{E}_{инд} = -\\frac{\\Delta\\Phi}{\\Delta t}$$`, desc: "Закон Фарадея." },
            { title: "ЭДС в движущемся проводнике", section: "Тест 29. Электромагнитная индукция", formula: `$$\\mathcal{E} = Blv \\sin\\alpha$$`, desc: "ЭДС в движущемся проводнике." },
            { title: "ЭДС самоиндукции", section: "Тест 29. Электромагнитная индукция", formula: `$$\\mathcal{E}_c = -L\\frac{\\Delta I}{\\Delta t}$$`, desc: "Явление самоиндукции." },
            { title: "Энергия магнитного поля", section: "Тест 29. Электромагнитная индукция", formula: `$$W_m = \\frac{LI^2}{2}$$`, desc: "Энергия катушки с током." },
            // ТЕСТ 30
            { title: "Уравнение гармонических колебаний", section: "Тест 30. Механические колебания и волны", formula: `$$x = x_{max} \\cos(\\omega t + \\varphi_0) \\newline x = x_{max} \\sin(\\omega t + \\varphi_0)$$`, desc: "Кинематический закон колебаний." },
            { title: "Период математического маятника", section: "Тест 30. Механические колебания и волны", formula: `$$T = 2\\pi\\sqrt{\\frac{l}{g}}$$`, desc: "Период колебаний математического маятника." },
            { title: "Период пружинного маятника", section: "Тест 30. Механические колебания и волны", formula: `$$T = 2\\pi\\sqrt{\\frac{m}{k}}$$`, desc: "Период колебаний пружинного маятника." },
            { title: "Длина волны", section: "Тест 30. Механические колебания и волны", formula: `$$\\lambda = vT$$`, desc: "Расстояние, на которое распространяется волна за период." },
            // ТЕСТ 31
            { title: "Колебательный контур (Формула Томсона)", section: "Тест 31. Электромагнитные колебания и волны. Переменный электрический ток", formula: `$$T = 2\\pi\\sqrt{LC}$$`, desc: "Период электромагнитных колебаний." },
            { title: "Действующие значения силы тока и напряжения", section: "Тест 31. Электромагнитные колебания и волны. Переменный электрический ток", formula: `$$I_{д} = \\frac{I_0}{\\sqrt{2}}, \\quad U_{д} = \\frac{U_0}{\\sqrt{2}}$$`, desc: "Параметры переменного тока." },
            { title: "Трансформатор", section: "Тест 31. Электромагнитные колебания и волны. Переменный электрический ток", formula: `$$k = \\frac{N_1}{N_2} = \\frac{U_1}{U_2}$$`, desc: " Коэффициент трансформации." },
            { title: "Длина электромагнитной волны", section: "Тест 31. Электромагнитные колебания и волны. Переменный электрический ток", formula: `$$\\lambda = cT$$`, desc: "Связь длины волны со скоростью света и периодом." },
            // ТЕСТ 32
            { title: "Законы отражения и преломления", section: "Тест 32. Геометрическая оптика", formula: `$$\\alpha = \\beta, \\quad \\frac{\\sin\\alpha}{\\sin\\gamma} = \\frac{n_2}{n_1}$$`, desc: "Угол падения равен углу отражения; закон Снеллиуса." },
            { title: "Абсолютный показатель преломления и полное отражение", section: "Тест 32. Геометрическая оптика", formula: `$$n = \\frac{c}{v}, \\quad \\sin\\alpha_0 = \\frac{n_2}{n_1}$$`, desc: "Скорость света в среде и предельный угол полного отражения." },
            // ТЕСТ 33
            { title: "Формула тонкой линзы и увеличение", section: "Тест 33. Линзы", formula: `$$\\pm \\frac{1}{F} = \\pm \\frac{1}{d} \\pm \\frac{1}{f}, \\quad \\Gamma = \\frac{H}{h} = \\frac{f}{d}$$`, desc: "Связь фокуса, расстояний и линейного увеличения." },
            { title: "Оптическая сила", section: "Тест 33. Линзы", formula: `$$D = \\frac{1}{F}$$`, desc: "Измеряется в диоптриях (дптр)." },
            // Тест 34
            { title: "Интерференция", section: "Тест 34. Волновая оптика", formula: `$$\\delta = m\\lambda,\\newline \\quad \\delta = \\frac{(2m + 1)}{2}\\lambda$$`, desc: "Условие максимума и минимума для оптической разности хода." },
            { title: "Дифракционная решетка", section: "Тест 34. Волновая оптика", formula: `$$d \\sin\\theta = m\\lambda$$`, desc: "Условие главных максимумов." },
            // ТЕСТ 35
            { title: "Релятивистская кинематика и динамика", section: "Тест 35. Специальная теория относительности. Фотоэффект", formula: `$$l = l_0 \\sqrt{1 - \\frac{v^2}{c^2}}$$`, desc: "Сокращение длины." },
            { title: "Релятивистская кинематика и динамика", section: "Тест 35. Специальная теория относительности. Фотоэффект", formula: `$$\\tau = \\frac{\\tau_0}{\\sqrt{1 - \\frac{v^2}{c^2}}}$$`, desc: "Замедление времени." },
            { title: "Релятивистская кинематика и динамика", section: "Тест 35. Специальная теория относительности. Фотоэффект", formula: `$$E = \\frac{m_0 c^2}{\\sqrt{1 - \\frac{v^2}{c^2}}}$$`, desc: "Полная энергия." },
            { title: "Релятивистская кинематика и динамика", section: "Тест 35. Специальная теория относительности. Фотоэффект", formula: `$$E = m c^2$$`, desc: "Энергия покоя." },
            { title: "Квантовая физика.", section: "Тест 35. Специальная теория относительности. Фотоэффект", formula: `$$E = h \\nu = \\frac{hc}{\\lambda}$$`, desc: "Энергия фотона." },
            { title: "Фотоэффект (Уравнение Эйнштейна)", section: "Тест 35. Специальная теория относительности. Фотоэффект", formula: `$$h\\nu = A_{вых} + E_{k max}$$`, desc: "Энергия фотона идет на работу выхода и кинетическую энергию." },
            { title: "Фотоэффект (Уравнение Эйнштейна)", section: "Тест 35. Специальная теория относительности. Фотоэффект", formula: `$$E_{k max} = eU_з$$`, desc: "Максимальная кинетическая энергия фотоэлектронов." },
            { title: "Красная граница фотоэффекта", section: "Тест 35. Специальная теория относительности. Фотоэффект", formula: `$$\\nu_{min} = \\frac{A_{вых}}{h}$$`, desc: "Минимальная частота, при которой еще возможен фотоэффект." },
            // ТЕСТ 36
            { title: "Постулаты Бора и энергия атома водорода", section: "Тест 36. Атомная и ядерная физика", formula: `$$h\\nu = E_k - E_m, \\quad E_n = \\frac{E_1}{n^2}$$`, desc: "Правило частот и уровни энергии." },
            { title: "Энергия связи ядра", section: "Тест 36. Атомная и ядерная физика", formula: `$$E_{св} = \\Delta m c^2$$`, desc: "Энергия, необходимая для расщепления ядра." },
            { title: "Дефект массы", section: "Тест 36. Атомная и ядерная физика", formula: `$$E_{св} = [Zm_p + Nm_n - m_{я}] \\cdot 931.5 \\text{ МэВ}$$`, desc: "Энергия связи в мегаэлектрон вольтах." },
            { title: "Закон радиоактивного распада", section: "Тест 36. Атомная и ядерная физика", formula: `$$N = N_0 2^{-\\frac{t}{T}}$$`, desc: "Уменьшение числа нераспавшихся ядер со временем." }
        ];

        const searchInput = document.getElementById('search');
        const sectionSelect = document.getElementById('section');
        const grid = document.getElementById('grid');

        const uniqueSections = [...new Set(formulas.map(f => f.section))];
        uniqueSections.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s; opt.textContent = s;
            sectionSelect.appendChild(opt);
        });

        function render() {
            const query = searchInput.value.toLowerCase();
            const selectedSection = sectionSelect.value;
            
            const filtered = formulas.filter(f => {
                const matchSection = selectedSection === 'all' || f.section === selectedSection;
                const matchSearch = f.title.toLowerCase().includes(query) || f.desc.toLowerCase().includes(query) || f.section.toLowerCase().includes(query);
                return matchSection && matchSearch;
            });

            grid.innerHTML = filtered.length ? '' : '<div class="empty">Ничего не найдено</div>';

            filtered.forEach(f => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <span class="section-tag">${f.section}</span>
                    <h3>${f.title}</h3>
                    <div class="formula">${f.formula}</div>
                    <div class="desc">${f.desc}</div>
                `;
                grid.appendChild(card);
            });

            if (window.innerWidth <= 768) {
                grid.scrollLeft = 0;
            }

            renderMathInElement(grid, {
                delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '\\(', right: '\\)', display: false }
                ],
                throwOnError: false,
                strict: false
            });
        }

        searchInput.addEventListener('input', render);
        sectionSelect.addEventListener('change', render);

        render();
    </script>
</body>
</html>
