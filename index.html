    <style>
      :root {
        --bg: #f4f6f8;
        --card: #ffffff;
        --accent: #2c3e50;
        --border: #dfe4ea;
        --tag-bg: #eef2f5;
        --tag-text: #7f8c8d;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--accent);
        margin: 0;
        padding: 20px;
      }
      h1 {
        text-align: center;
        margin-bottom: 10px;
        font-size: 24px;
      }
      .subtitle {
        text-align: center;
        color: var(--tag-text);
        margin-bottom: 25px;
        font-size: 14px;
      }
      .controls {
        display: flex;
        gap: 15px;
        max-width: 900px;
        margin: 0 auto 30px;
        flex-wrap: wrap;
      }
      .controls input,
      .controls select {
        flex: 1;
        padding: 12px 15px;
        font-size: 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        min-width: 200px;
        outline: none;
      }
      .controls input:focus,
      .controls select:focus {
        border-color: #3498db;
      }

      /* Базовая сетка для десктопа */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
        gap: 20px;
        max-width: 1400px;
        margin: 0 auto;
        grid-auto-rows: 1fr; /* Заставляет все карточки в ряду быть одинаковой высоты */
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        /* --- НОВЫЕ СВОЙСТВА ДЛЯ ПРИЖАТИЯ К НИЗУ --- */
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
      }
      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      }
      .card h3 {
        margin: 0 0 10px 0;
        font-size: 17px;
        color: #2980b9;
      }
      .card .section-tag {
        display: inline-block;
        font-size: 11px;
        background: var(--tag-bg);
        padding: 4px 8px;
        border-radius: 4px;
        margin-bottom: 12px;
        color: var(--tag-text);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .card .formula {
        font-size: 1.6em;
        text-align: center;
        margin: 15px 0;
        min-height: 40px;
        max-width: 100%;
        overflow-x: auto;
        line-height: 1.8;
        flex: 1; /* Занимает всё свободное пространство */
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card .formula .katex-display {
        margin: 0.5em 0;
        overflow-x: auto;
        overflow-y: hidden;
      }
      .card .desc {
        font-size: 14px;
        color: #555;
        line-height: 1.4;
        /* --- МАГИЯ: этот отступ займет всё свободное пространство и прижмет блок к низу --- */
        margin-top: auto;
        border-top: 1px dashed var(--border);
        padding-top: 10px;
      }
      .empty {
        text-align: center;
        color: #95a5a6;
        grid-column: 1 / -1;
        padding: 40px;
        font-size: 18px;
      }

      /* ========================================== */
      /* МОБИЛЬНАЯ ВЕРСИЯ СО СВАЙПОМ (Scroll Snap)  */
      /* ========================================== */
      @media (max-width: 768px) {
        body {
          padding: 15px;
        }
        .controls {
          flex-direction: column;
          gap: 10px;
          margin-bottom: 20px;
        }
        .controls input,
        .controls select {
          width: 100%;
        }
        .controls input,
        .controls select {
          width: 100%;
          min-width: unset; /* Убираем min-width: 200px */
          box-sizing: border-box; /* Чтобы padding не увеличивал ширину */
        }
        .grid {
          display: flex;
          overflow-x: auto;
          scroll-snap-type: x mandatory;
          -webkit-overflow-scrolling: touch;
          gap: 16px;
          padding: 10px 5px 30px 5px;
          margin: 0 -5px;
          scrollbar-width: none;
          align-items: stretch; /* Гарантирует одинаковую высоту карточек при свайпе */
        }
        .grid::-webkit-scrollbar {
          display: none;
        }

        .card {
          flex: 0 0 85vw;
          scroll-snap-align: center;
          height: 52vh;
        }

        .card:last-child {
          margin-right: 20px;
        }
      }
    </style>
  </head>

        // Уведомление
function showToast(message) {
    const toast = document.createElement('div');
    toast.textContent = message;
    toast.style.cssText = `
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.8);
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 9999;
        animation: fadeInOut 2s ease-in-out;
    `;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
}

// Анимация для уведомления
const style = document.createElement('style');
style.textContent = `
    @keyframes fadeInOut {
        0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
        15%, 85% { opacity: 1; transform: translateX(-50%) translateY(0); }
        100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }
`;
document.head.appendChild(style);

// Блокировка сохранения страницы
document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key.toLowerCase() === 's') {
        e.preventDefault();
        showToast('Сохранение страницы запрещено');
    }
    if (e.ctrlKey && e.key.toLowerCase() === 'p') {
        e.preventDefault();
        showToast('Печать запрещена');
    }
    if (e.ctrlKey && e.key.toLowerCase() === 'a') {
        if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
            showToast('Выделение запрещено');
        }
    }
});

document.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    showToast('Сохранение страницы запрещено');
});

window.addEventListener('beforeunload', (e) => {
    document.body.innerHTML = '';
});

      const searchInput = document.getElementById("search");
      const sectionSelect = document.getElementById("section");
      const grid = document.getElementById("grid");

      const uniqueSections = [...new Set(formulas.map((f) => f.section))];
      uniqueSections.forEach((s) => {
        const opt = document.createElement("option");
        opt.value = s;
        opt.textContent = s;
        sectionSelect.appendChild(opt);
      });

      function render() {
const query = searchInput.value.toLowerCase().trim();
const selectedSection = sectionSelect.value;

// Разбиваем запрос на отдельные слова и убираем пустые
const queryWords = query.split(/\s+/).filter(word => word.length > 0);

const filtered = formulas.filter((f) => {
    const matchSection = selectedSection === "all" || f.section === selectedSection;
    
    // Если поисковая строка пустая — пропускаем проверку по словам
    let matchSearch = true;
    if (queryWords.length > 0) {
        // Объединяем все поля в одну строку для поиска
        const combinedText = (f.title + " " + f.desc + " " + f.section).toLowerCase();
        
        // КАЖДОЕ слово из запроса должно встречаться в объединённом тексте
        matchSearch = queryWords.every(word => combinedText.includes(word));
    }
    
    return matchSection && matchSearch;
});


        grid.innerHTML = filtered.length
          ? ""
          : '<div class="empty">Ничего не найдено</div>';

        filtered.forEach((f) => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
                    <span class="section-tag">${f.section}</span>
                    <h3>${f.title}</h3>
                    <div class="formula">${f.formula}</div>
                    <div class="desc">${f.desc}</div>
                `;
          grid.appendChild(card);
        });

        if (window.innerWidth <= 768) {
          grid.scrollLeft = 0;
        }

        renderMathInElement(grid, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "\\(", right: "\\)", display: false },
          ],
          throwOnError: false,
          strict: false,
        });
      }

      searchInput.addEventListener('input', () => {
            sectionSelect.value = 'all';
            render();
        });
        sectionSelect.addEventListener('change', render);


      render();
   </script>
